name: Modern Facts Shorts

on:
  workflow_dispatch:

jobs:
  shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Shorts generator
        run: |
          echo "Shorts automation setup"
          echo "Video generation will be connected here next."
