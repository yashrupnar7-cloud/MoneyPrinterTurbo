name: Modern Facts Shorts

on:
  workflow_dispatch:

jobs:
  shorts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("config.example.toml").read_text()
          source = source.replace(
              'llm_provider = "moonshot"',
              'llm_provider = "gemini"'
          )
          source = source.replace(
              'gemini_api_key = ""',
              'gemini_api_key = "${GEMINI_API_KEY}"'
          )

          Path("config.toml").write_text(source)
          PY

      - name: Run Shorts generator
        run: |
          echo "Gemini configured."
          echo "Next we will connect actual video generation."
